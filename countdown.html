<meta charset="UTF-8">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --gold: #d9b66f;
  --light: #f4dfa9;
  --navy: #080d19;
}

body {
  min-height: 100vh;
  background:
    radial-gradient(circle at 20% 20%, #26365366, transparent 40%),
    radial-gradient(circle at 80% 80%, #9b753133, transparent 40%),
    var(--navy);
  color: white;
  font-family: 'Montserrat', sans-serif;
}

nav {
  position: fixed;
  top: 15px;
  left: 5%;
  width: 90%;
  padding: 17px 22px;
  background: #ffffff0d;
  border: 1px solid #ffffff20;
  border-radius: 16px;
  backdrop-filter: blur(20px);
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 10;
}

.logo {
  color: var(--gold);
  font-family: 'Cinzel', serif;
  font-size: 21px;
  font-weight: bold;
  letter-spacing: 3px;
}

nav a {
  color: #ddd;
  text-decoration: none;
  font-size: 10px;
  margin-left: 12px;
}

nav a:hover {
  color: var(--gold);
}

main {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 120px 20px 70px;
}

.content {
  max-width: 900px;
  width: 100%;
  animation: fade .9s ease;
}

.label {
  color: var(--gold);
  letter-spacing: 6px;
  font-size: 10px;
  margin-bottom: 22px;
}

h1 {
  font-family: 'Cinzel', serif;
  color: var(--light);
  font-size: clamp(40px, 8vw, 75px);
}

.subtitle {
  color: #aeb5c3;
  font-size: 12px;
  letter-spacing: 4px;
  margin-top: 15px;
}

.line {
  width: 110px;
  height: 1px;
  background: linear-gradient(90deg,transparent,var(--gold),transparent);
  margin: 30px auto;
}

.description {
  font-size: 12px;
  color: #aeb5c3;
  line-height: 2;
}

.timer {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 18px;
  margin: 45px auto;
  max-width: 750px;
}

.time-box {
  padding: 30px 12px;
  background: #ffffff0b;
  border: 1px solid #d9b66f55;
  border-radius: 18px;
  backdrop-filter: blur(20px);
  box-shadow: 0 15px 40px #0003;
}

.number {
  font-family: 'Cinzel', serif;
  font-size: clamp(30px, 6vw, 55px);
  color: var(--light);
}

.unit {
  margin-top: 12px;
  font-size: 10px;
  color: var(--gold);
  letter-spacing: 3px;
}

.message {
  color: var(--gold);
  font-family: 'Cinzel', serif;
  font-size: 20px;
  margin-top: 30px;
}

.date {
  color: #8c96a7;
  font-size: 11px;
  margin-top: 15px;
}

.back {
  display: inline-block;
  margin-top: 35px;
  padding: 13px 25px;
  border: 1px solid #d9b66f88;
  border-radius: 8px;
  color: var(--gold-light);
  text-decoration: none;
  font-size: 10px;
  letter-spacing: 2px;
}

footer {
  text-align: center;
  padding: 25px;
  border-top: 1px solid #ffffff15;
  color: #777f8d;
  font-size: 10px;
  letter-spacing: 2px;
}

footer span {
  color: var(--gold);
}

@keyframes fade {
  from { opacity: 0; transform: translateY(25px); }
  to { opacity: 1; transform: translateY(0); }
}

@media(max-width:600px) {
  .timer {
    grid-template-columns: repeat(2,1fr);
    gap: 12px;
  }

  .time-box {
    padding: 25px 10px;
  }

  nav a {
    font-size: 8px;
    margin-left: 7px;
  }
}
</style>

@media(max-width:760px){nav,.navbar{padding:14px 18px!important;flex-wrap:wrap}.menu,.nav-links{width:100%;justify-content:center;gap:12px}.menu a,.nav-links a{font-size:11px}.hero{min-height:58vh!important;padding:85px 18px 55px!important}.cards,.grid,.values,.contact-grid{grid-template-columns:1fr!important}.section{padding:55px 6%!important}}

<body>

<nav>
  <div class="logo">PG 620</div>

  <div>
    <a href="index.html">HOME</a>
    <a href="about.html">ABOUT</a>
    <a href="gallery.html">GALLERY</a>
  </div>
</nav>

<main>
  <div class="content">

    <div class="label">SAVE THE MOMENT</div>

    <h1>THE COUNTDOWN</h1>

    <div class="subtitle">PANGGUNG GEMBIRA 620</div>

    <div class="line"></div>

    <p class="description">
      Every Second Brings Us Closer To A Moment
      Worth Remembering.
    </p>

    <div class="timer">

      <div class="time-box">
        <div class="number" id="days">00</div>
        <div class="unit">DAYS</div>
      </div>

      <div class="time-box">
        <div class="number" id="hours">00</div>
        <div class="unit">HOURS</div>
      </div>

      <div class="time-box">
        <div class="number" id="minutes">00</div>
        <div class="unit">MINUTES</div>
      </div>

      <div class="time-box">
        <div class="number" id="seconds">00</div>
        <div class="unit">SECONDS</div>
      </div>

    </div>

    <div class="message" id="message">
      THE MOMENT IS COMING
    </div>

    <div class="date" id="dateText">
      Tanggal acara akan diumumkan
    </div>

    <a href="index.html" class="back">
      BACK TO HOME
    </a>

  </div>
</main>

<footer>
  © 2026 <span>PANGGUNG GEMBIRA 620</span>
</footer>

<script>

// Ganti tanggal setelah tanggal acara ditetapkan.
// Format: TAHUN, BULAN-1, TANGGAL, JAM, MENIT

const targetDate = new Date(2027, 7, 29, 19, 0, 0);

const dateText = document.getElementById("dateText");

dateText.textContent = "29 AGUSTUS 2027 • 19.00 WIB (CONTOH TANGGAL)";

function updateCountdown() {

  const now = new Date();
  const distance = targetDate - now;

  if (distance <= 0) {

    document.getElementById("days").textContent = "00";
    document.getElementById("hours").textContent = "00";
    document.getElementById("minutes").textContent = "00";
    document.getElementById("seconds").textContent = "00";

    document.getElementById("message").textContent =
      "THE MOMENT HAS ARRIVED";

    return;
  }

  const days = Math.floor(distance / (1000 * 60 * 60 * 24));
  const hours = Math.floor((distance / (1000 * 60 * 60)) % 24);
  const minutes = Math.floor((distance / (1000 * 60)) % 60);
  const seconds = Math.floor((distance / 1000) % 60);

  document.getElementById("days").textContent =
    String(days).padStart(2,"0");

  document.getElementById("hours").textContent =
    String(hours).padStart(2,"0");

  document.getElementById("minutes").textContent =
    String(minutes).padStart(2,"0");

  document.getElementById("seconds").textContent =
    String(seconds).padStart(2,"0");
}

updateCountdown();
setInterval(updateCountdown,1000);

</script>
